<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" fill="url(#bg)" rx="19.2"/>
  
  <!-- Cards -->
  <g transform="translate(25.6, 32)">
    <!-- Back card -->
    <rect x="0" y="12.8" width="44.8" height="64" 
          fill="#000000" stroke="url(#gold)" stroke-width="2.56" rx="3.84"/>
    
    <!-- Front card -->
    <rect x="32" y="0" width="44.8" height="64" 
          fill="#000000" stroke="url(#gold)" stroke-width="2.56" rx="3.84"/>
    
    <!-- Card symbol (spade) -->
    <text x="54.4" y="38.4" 
          font-size="19.2" fill="#FFFFFF" 
          font-family="Arial" text-anchor="middle">♠</text>
    
    <!-- Card rank (A) -->
    <text x="38.4" y="19.2" 
          font-size="10.24" fill="#FFFFFF" 
          font-family="Arial" font-weight="bold">A</text>
  </g>
</svg>