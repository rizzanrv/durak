<svg width="384" height="384" viewBox="0 0 384 384" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="384" height="384" fill="url(#bg)" rx="57.599999999999994"/>
  
  <!-- Cards -->
  <g transform="translate(76.80000000000001, 96)">
    <!-- Back card -->
    <rect x="0" y="38.400000000000006" width="134.39999999999998" height="192" 
          fill="#000000" stroke="url(#gold)" stroke-width="7.68" rx="11.52"/>
    
    <!-- Front card -->
    <rect x="96" y="0" width="134.39999999999998" height="192" 
          fill="#000000" stroke="url(#gold)" stroke-width="7.68" rx="11.52"/>
    
    <!-- Card symbol (spade) -->
    <text x="163.2" y="115.19999999999999" 
          font-size="57.599999999999994" fill="#FFFFFF" 
          font-family="Arial" text-anchor="middle">♠</text>
    
    <!-- Card rank (A) -->
    <text x="115.19999999999999" y="57.599999999999994" 
          font-size="30.72" fill="#FFFFFF" 
          font-family="Arial" font-weight="bold">A</text>
  </g>
</svg>