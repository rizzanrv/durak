<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" fill="url(#bg)" rx="28.799999999999997"/>
  
  <!-- Cards -->
  <g transform="translate(38.400000000000006, 48)">
    <!-- Back card -->
    <rect x="0" y="19.200000000000003" width="67.19999999999999" height="96" 
          fill="#000000" stroke="url(#gold)" stroke-width="3.84" rx="5.76"/>
    
    <!-- Front card -->
    <rect x="48" y="0" width="67.19999999999999" height="96" 
          fill="#000000" stroke="url(#gold)" stroke-width="3.84" rx="5.76"/>
    
    <!-- Card symbol (spade) -->
    <text x="81.6" y="57.599999999999994" 
          font-size="28.799999999999997" fill="#FFFFFF" 
          font-family="Arial" text-anchor="middle">♠</text>
    
    <!-- Card rank (A) -->
    <text x="57.599999999999994" y="28.799999999999997" 
          font-size="15.36" fill="#FFFFFF" 
          font-family="Arial" font-weight="bold">A</text>
  </g>
</svg>