<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="76.8"/>
  
  <!-- Cards -->
  <g transform="translate(102.4, 128)">
    <!-- Back card -->
    <rect x="0" y="51.2" width="179.2" height="256" 
          fill="#000000" stroke="url(#gold)" stroke-width="10.24" rx="15.36"/>
    
    <!-- Front card -->
    <rect x="128" y="0" width="179.2" height="256" 
          fill="#000000" stroke="url(#gold)" stroke-width="10.24" rx="15.36"/>
    
    <!-- Card symbol (spade) -->
    <text x="217.6" y="153.6" 
          font-size="76.8" fill="#FFFFFF" 
          font-family="Arial" text-anchor="middle">♠</text>
    
    <!-- Card rank (A) -->
    <text x="153.6" y="76.8" 
          font-size="40.96" fill="#FFFFFF" 
          font-family="Arial" font-weight="bold">A</text>
  </g>
</svg>