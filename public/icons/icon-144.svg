<svg width="144" height="144" viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="144" height="144" fill="url(#bg)" rx="21.599999999999998"/>
  
  <!-- Cards -->
  <g transform="translate(28.8, 36)">
    <!-- Back card -->
    <rect x="0" y="14.4" width="50.4" height="72" 
          fill="#000000" stroke="url(#gold)" stroke-width="2.88" rx="4.32"/>
    
    <!-- Front card -->
    <rect x="36" y="0" width="50.4" height="72" 
          fill="#000000" stroke="url(#gold)" stroke-width="2.88" rx="4.32"/>
    
    <!-- Card symbol (spade) -->
    <text x="61.199999999999996" y="43.199999999999996" 
          font-size="21.599999999999998" fill="#FFFFFF" 
          font-family="Arial" text-anchor="middle">♠</text>
    
    <!-- Card rank (A) -->
    <text x="43.199999999999996" y="21.599999999999998" 
          font-size="11.52" fill="#FFFFFF" 
          font-family="Arial" font-weight="bold">A</text>
  </g>
</svg>