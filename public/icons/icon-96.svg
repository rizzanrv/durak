<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="96" height="96" fill="url(#bg)" rx="14.399999999999999"/>
  
  <!-- Cards -->
  <g transform="translate(19.200000000000003, 24)">
    <!-- Back card -->
    <rect x="0" y="9.600000000000001" width="33.599999999999994" height="48" 
          fill="#000000" stroke="url(#gold)" stroke-width="1.92" rx="2.88"/>
    
    <!-- Front card -->
    <rect x="24" y="0" width="33.599999999999994" height="48" 
          fill="#000000" stroke="url(#gold)" stroke-width="1.92" rx="2.88"/>
    
    <!-- Card symbol (spade) -->
    <text x="40.8" y="28.799999999999997" 
          font-size="14.399999999999999" fill="#FFFFFF" 
          font-family="Arial" text-anchor="middle">♠</text>
    
    <!-- Card rank (A) -->
    <text x="28.799999999999997" y="14.399999999999999" 
          font-size="7.68" fill="#FFFFFF" 
          font-family="Arial" font-weight="bold">A</text>
  </g>
</svg>