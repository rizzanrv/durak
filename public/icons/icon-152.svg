<svg width="152" height="152" viewBox="0 0 152 152" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="152" height="152" fill="url(#bg)" rx="22.8"/>
  
  <!-- Cards -->
  <g transform="translate(30.400000000000002, 38)">
    <!-- Back card -->
    <rect x="0" y="15.200000000000001" width="53.199999999999996" height="76" 
          fill="#000000" stroke="url(#gold)" stroke-width="3.04" rx="4.56"/>
    
    <!-- Front card -->
    <rect x="38" y="0" width="53.199999999999996" height="76" 
          fill="#000000" stroke="url(#gold)" stroke-width="3.04" rx="4.56"/>
    
    <!-- Card symbol (spade) -->
    <text x="64.6" y="45.6" 
          font-size="22.8" fill="#FFFFFF" 
          font-family="Arial" text-anchor="middle">♠</text>
    
    <!-- Card rank (A) -->
    <text x="45.6" y="22.8" 
          font-size="12.16" fill="#FFFFFF" 
          font-family="Arial" font-weight="bold">A</text>
  </g>
</svg>