<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Durak">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/img/icon-192.svg">
  <title>Durak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app">
    <div id="splash-screen" class="screen active">
      <div class="splash-logo">
        <div class="logo-icon">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
            <rect x="8" y="4" width="40" height="56" rx="6" fill="#1a1a2e" stroke="#6C5CE7" stroke-width="2"/>
            <rect x="16" y="4" width="40" height="56" rx="6" fill="#16162a" stroke="#6C5CE7" stroke-width="2"/>
            <text x="36" y="40" text-anchor="middle" fill="#6C5CE7" font-size="24" font-weight="700" font-family="Inter">D</text>
          </svg>
        </div>
        <h1 class="splash-title" data-i18n="app_name">DURAK</h1>
        <p class="splash-subtitle" data-i18n="subtitle">Classic Card Game</p>
      </div>
      <div class="splash-loader"><div class="loader-bar"></div></div>
    </div>

    <div id="auth-screen" class="screen">
      <div class="auth-container">
        <div class="auth-header">
          <h2 class="auth-title" data-i18n="app_name">DURAK</h2>
        </div>
        <div id="login-form" class="auth-form active">
          <h3 class="form-title" data-i18n="sign_in">Sign In</h3>
          <div class="input-group"><input type="text" id="login-login" data-i18n-placeholder="login_placeholder" placeholder="Username or email"></div>
          <div class="input-group"><input type="password" id="login-password" data-i18n-placeholder="password" placeholder="Password"></div>
          <button class="btn btn-primary" id="btn-login" data-i18n="sign_in">Sign In</button>
          <p class="auth-switch"><span data-i18n="no_account">No account?</span> <a href="#" id="show-register" data-i18n="register">Register</a></p>
        </div>
        <div id="register-form" class="auth-form">
          <h3 class="form-title" data-i18n="create_account">Create Account</h3>
          <div class="input-group"><input type="text" id="reg-username" data-i18n-placeholder="username" placeholder="Username"></div>
          <div class="input-group"><input type="email" id="reg-email" data-i18n-placeholder="email" placeholder="Email"></div>
          <div class="input-group"><input type="password" id="reg-password" data-i18n-placeholder="password_min" placeholder="Password (min 6)"></div>
          <button class="btn btn-primary" id="btn-register" data-i18n="create_account">Create Account</button>
          <p class="auth-switch"><span data-i18n="has_account">Already have account?</span> <a href="#" id="show-login" data-i18n="sign_in">Sign In</a></p>
        </div>
        <div id="auth-error" class="error-message"></div>
      </div>
    </div>

    <div id="main-screen" class="screen">
      <header class="main-header">
        <div class="header-left">
          <div class="user-avatar" id="header-avatar"></div>
          <div>
            <div class="user-name" id="header-username"></div>
            <div class="user-rating" id="header-rating"></div>
          </div>
        </div>
        <div class="header-right">
          <button class="lang-btn" id="btn-lang">EN</button>
          <button class="btn-icon" id="btn-settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </header>

      <nav class="bottom-nav">
        <button class="nav-item active" data-tab="play">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <span data-i18n="play">Play</span>
        </button>
        <button class="nav-item" data-tab="friends">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          <span data-i18n="friends">Friends</span>
        </button>
        <button class="nav-item" data-tab="history">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span data-i18n="history">History</span>
        </button>
        <button class="nav-item" data-tab="profile">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span data-i18n="profile">Profile</span>
        </button>
      </nav>

      <div class="tab-content">
        <div id="tab-play" class="tab-panel active">
          <h2 class="section-title" data-i18n="select_mode">Select Mode</h2>
          <div class="mode-grid">
            <button class="mode-card" data-mode="classic">
              <svg width="36" height="36" viewBox="0 0 48 48" fill="none"><rect x="6" y="4" width="28" height="40" rx="4" fill="#1a1a2e" stroke="#6C5CE7" stroke-width="1.5"/><rect x="14" y="4" width="28" height="40" rx="4" fill="#16162a" stroke="#6C5CE7" stroke-width="1.5"/></svg>
              <h3 data-i18n="classic">Classic</h3><p data-i18n="classic_desc">2 players, standard rules</p>
            </button>
            <button class="mode-card" data-mode="transfer">
              <svg width="36" height="36" viewBox="0 0 48 48" fill="none"><rect x="4" y="8" width="24" height="32" rx="4" fill="#1a1a2e" stroke="#00B894" stroke-width="1.5"/><rect x="20" y="8" width="24" height="32" rx="4" fill="#16162a" stroke="#00B894" stroke-width="1.5"/></svg>
              <h3 data-i18n="transfer">Transfer</h3><p data-i18n="transfer_desc">2-6 players, pass cards</p>
            </button>
            <button class="mode-card" data-mode="vs_ai">
              <svg width="36" height="36" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="20" r="12" fill="#1a1a2e" stroke="#E17055" stroke-width="1.5"/><rect x="16" y="16" width="6" height="6" rx="1" fill="#E17055"/><rect x="26" y="16" width="6" height="6" rx="1" fill="#E17055"/></svg>
              <h3 data-i18n="vs_ai">vs AI</h3><p data-i18n="vs_ai_desc">Single player vs computer</p>
            </button>
            <button class="mode-card" data-mode="custom">
              <svg width="36" height="36" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="16" fill="#1a1a2e" stroke="#0984E3" stroke-width="1.5"/><path d="M24 16v16M16 24h16" stroke="#0984E3" stroke-width="2"/></svg>
              <h3 data-i18n="custom">Custom</h3><p data-i18n="custom_desc">Create or join room</p>
            </button>
          </div>

          <div id="lobby-view" class="lobby-view" style="display:none;">
            <div class="lobby-header">
              <button class="btn-back" id="btn-back-lobby"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
              <h2 id="lobby-title" data-i18n="lobby">Lobby</h2>
            </div>
            <div class="lobby-players" id="lobby-players"></div>
            <div class="lobby-actions">
              <button class="btn btn-secondary" id="btn-invite-friend" data-i18n="invite">Invite Friend</button>
              <button class="btn btn-secondary" id="btn-add-ai" data-i18n="add_ai">Add AI</button>
              <button class="btn btn-primary" id="btn-ready" data-i18n="ready">Ready</button>
              <button class="btn btn-primary" id="btn-start" style="display:none;" data-i18n="start_game">Start Game</button>
            </div>
          </div>

          <div id="room-list" class="room-list" style="display:none;">
            <h2 class="section-title" data-i18n="open_rooms">Open Rooms</h2>
            <div id="rooms-container"></div>
            <button class="btn btn-primary" id="btn-create-room" data-i18n="create_room">Create Room</button>
          </div>
        </div>

        <div id="tab-friends" class="tab-panel">
          <h2 class="section-title" data-i18n="friends">Friends</h2>
          <div class="search-bar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="friend-search" data-i18n-placeholder="search_players" placeholder="Search players...">
          </div>
          <div id="friend-received" class="friend-section"></div>
          <div id="friend-sent" class="friend-section"></div>
          <div id="friends-list" class="friend-section"></div>
          <div id="search-results" class="friend-section"></div>
        </div>

        <div id="tab-history" class="tab-panel">
          <h2 class="section-title" data-i18n="history">History</h2>
          <div id="history-list"></div>
        </div>

        <div id="tab-profile" class="tab-panel">
          <div class="profile-card">
            <div class="profile-avatar" id="profile-avatar"></div>
            <h2 id="profile-username"></h2>
            <div class="profile-stats">
              <div class="stat"><span class="stat-value" id="stat-rating">0</span><span class="stat-label" data-i18n="rating">Rating</span></div>
              <div class="stat"><span class="stat-value" id="stat-games">0</span><span class="stat-label" data-i18n="games">Games</span></div>
              <div class="stat"><span class="stat-value" id="stat-wins">0</span><span class="stat-label" data-i18n="wins">Wins</span></div>
            </div>
          </div>
          <button class="btn btn-danger" id="btn-logout" data-i18n="sign_out">Sign Out</button>
        </div>
      </div>
    </div>

    <div id="game-screen" class="screen">
      <div class="game-header">
        <div class="game-info">
          <div class="trump-display" id="trump-display"></div>
          <div class="deck-count" id="deck-count">
            <div style="position:relative;width:28px;height:40px;">
              <div style="position:absolute;width:24px;height:36px;border-radius:4px;background:var(--card-bg);border:1.5px solid var(--card-border);transform:rotate(-5deg);"></div>
              <div style="position:absolute;width:24px;height:36px;border-radius:4px;background:var(--card-bg);border:1.5px solid var(--card-border);transform:rotate(3deg);left:3px;"></div>
              <span style="position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--accent);" id="deck-count-text">0</span>
            </div>
          </div>
        </div>
        <div class="game-mode-label" id="game-mode-label"></div>
        <button class="btn-icon" id="btn-game-menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
      <div class="opponents-area" id="opponents-area"></div>
      <div class="table-area" id="table-area">
        <div class="table-cards" id="table-cards"></div>
        <div class="table-actions" id="table-actions" style="display:none;">
          <button class="btn-take" id="btn-take" data-i18n="take">Take</button>
        </div>
      </div>
      <div class="player-hand" id="player-hand"></div>
      <div class="player-info">
        <div class="player-avatar-small" id="game-player-avatar"></div>
        <span class="player-name-small" id="game-player-name"></span>
      </div>
    </div>

    <div id="invite-modal" class="invite-overlay" style="display:none;">
      <div class="invite-modal">
        <h3 data-i18n="game_invite">Game Invite</h3>
        <p id="invite-message"></p>
        <div class="invite-actions">
          <button class="btn btn-primary" id="btn-invite-accept" data-i18n="accept">Accept</button>
          <button class="btn btn-secondary" id="btn-invite-reject" data-i18n="reject">Decline</button>
        </div>
      </div>
    </div>

    <div id="invite-friends-modal" class="invite-overlay" style="display:none;">
      <div class="invite-modal">
        <h3 data-i18n="invite">Invite Friend</h3>
        <div id="invite-friends-list"></div>
        <button class="btn btn-secondary" id="btn-close-invite" style="margin-top:12px;">Close</button>
      </div>
    </div>

    <div id="game-over-modal" class="modal" style="display:none;">
      <div class="modal-content game-over-content">
        <div class="game-over-icon" id="game-over-icon"></div>
        <h2 id="game-over-title"></h2>
        <p id="game-over-message"></p>
        <button class="btn btn-primary" id="btn-play-again" data-i18n="play_again">Play Again</button>
        <button class="btn btn-secondary" id="btn-to-lobby" data-i18n="back_menu" style="margin-top:8px;">Back to Menu</button>
      </div>
    </div>

    <div id="toast-container" class="toast-container"></div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
